# Compila la app nativa de Mac en la nube (runner macOS de GitHub) y deja
# 141Studio.app.zip como artefacto descargable — sin necesidad de Xcode local.
name: Build Mac app

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths: ["native/mac/**"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar el Xcode más nuevo del runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Compilar (firma ad-hoc, universal)
        run: |
          cd native/mac
          xcodebuild \
            -project 141Studio.xcodeproj \
            -target 141Studio \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Empaquetar
        run: |
          cd native/mac/build/Release
          ditto -c -k --sequesterRsrc --keepParent 141Studio.app 141Studio.app.zip

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: 141Studio-mac
          path: native/mac/build/Release/141Studio.app.zip
          retention-days: 30
