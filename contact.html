<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>141'Digital Agency</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,300&family=Inter+Display:ital,opsz,wght@0,32..48,300;0,32..48,400;0,32..48,500;0,32..48,600;0,32..48,700;0,32..48,800;1,32..48,300;1,32..48,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:     #000000;
      --black-2:   #0e0e0e;
      --white:     #f8f8f8;
      --white-60:  rgba(248,248,248,0.6);
      --white-07:  rgba(248,248,248,0.07);
      --neutral:   #888;
      --f-sans:    "Inter", ui-sans-serif, system-ui, sans-serif;
      --f-display: "Inter Display", "Inter", ui-sans-serif, system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--f-sans);
      background: var(--black);
      color: var(--white);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── Nav — idéntico a landing.html ──────────────────────────── */
    nav {
      position: fixed;
      top: 2.1rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 3rem);
      max-width: 680px;
      z-index: 100;
      padding: 0.45rem 0.45rem 0.45rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f0f0f;
      border: none;
      border-radius: 12px;
      transition: box-shadow 0.3s;
    }
    nav.scrolled { box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .nav-fade { display: none; } /* solo se muestra en móvil */

    .nav-logo { display: flex; align-items: center; }
    .nav-logo img { height: 26px; width: auto; display: block; }

    .nav-cta {
      font-family: var(--f-display);
      font-size: 1rem;
      font-weight: 450;
      padding: 0.55rem 0.9rem;
      background: var(--white);
      color: var(--black);
      border-radius: 10px;
      border: none;
      transition: opacity 0.2s, transform 0.15s;
      cursor: pointer;
      letter-spacing: -0.01em;
    }
    .nav-cta:hover { opacity: 0.85; transform: translateY(-1px); }

    /* ─── Page body ───────────────────────────────────────────────── */
    .page-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 7.7rem 1.5rem 0;
      gap: 1.5rem;
    }

    .page-eyebrow {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--neutral);
      margin-bottom: 0.75rem;
    }

    .page-title {
      font-family: var(--f-display);
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 300;
      letter-spacing: -0.025em;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 0;
    }

    /* ─── Cal.com embed ───────────────────────────────────────────── */
    #cal-embed {
      width: 100%;
      max-width: 900px;
      height: 100%;
    }

    /* ─── Móvil: permitir scroll (el calendario es más alto que la pantalla) ── */
    @media (max-width: 640px) {
      html, body { height: auto; overflow-x: hidden; overflow-y: auto; }
      .page-wrap { padding: 6.5rem 1rem 3rem; }
      #cal-embed { height: auto; min-height: 78vh; }
      /* header idéntico al de la página principal */
      nav { top: 1.4rem; }
      .nav-cta { font-size: 0.82rem; padding: 0.5rem 0.85rem; }
      nav.scrolled { box-shadow: none; }
      .nav-fade {
        display: block;
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 130px;
        background: linear-gradient(to bottom, #000 0%, #000 38%, rgba(0,0,0,0) 100%);
        z-index: 99;
        pointer-events: none;
      }
    }
  </style>
</head>
<body>

  <!-- degradado tras el header fijo (solo móvil) -->
  <div class="nav-fade" aria-hidden="true"></div>

  <!-- ─── Nav ─────────────────────────────────────────────────── -->
  <nav id="nav">
    <a href="landing.html" class="nav-logo"><img src="logo.svg" alt="141'STUDIO"></a>
    <a href="landing.html" class="nav-cta">← Volver</a>
  </nav>

  <!-- ─── Contenido ────────────────────────────────────────────── -->
  <div class="page-wrap">
    <div style="display:flex;flex-direction:column;align-items:center;gap:0.05rem;">
      <p class="page-eyebrow">Reserva una llamada</p>
      <h1 class="page-title">Hablemos de tu proyecto</h1>
    </div>
    <div id="cal-embed"></div>
  </div>

  <!-- ─── Cal.com embed script ─────────────────────────────────── -->
  <script type="text/javascript">
    (function (C, A, L) {
      let p = function (a, ar) { a.q.push(ar); };
      let d = C.document;
      C.Cal = C.Cal || function () {
        let cal = C.Cal; let ar = arguments;
        if (!cal.loaded) {
          cal.ns = {}; cal.q = cal.q || [];
          d.head.appendChild(d.createElement("script")).src = A;
          cal.loaded = true;
        }
        if (ar[0] === L) {
          const api = function () { p(api, arguments); };
          const namespace = ar[1];
          api.q = api.q || [];
          typeof namespace === "string"
            ? (cal.ns[namespace] = api) && p(api, ar)
            : p(cal, ar);
          return;
        }
        p(cal, ar);
      };
    })(window, "https://app.cal.com/embed/embed.js", "init");

    Cal("init", { origin: "https://cal.com" });

    /* en móvil usamos un layout más compacto (column_view) en vez del mes completo */
    var calLayout = window.matchMedia("(max-width: 640px)").matches ? "column_view" : "month_view";

    Cal("inline", {
      elementOrSelector: "#cal-embed",
      calLink: "nil141agency/15min",
      layout: calLayout
    });

    Cal("ui", {
      theme: "dark",
      styles: { branding: { brandColor: "#ffffff" } },
      hideEventTypeDetails: false,
      layout: calLayout
    });
  </script>

  <script>
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });
  </script>

</body>
</html>
